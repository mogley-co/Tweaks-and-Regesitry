name: Build Windows application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish self-contained x64
        run: dotnet publish --configuration Release --runtime win-x64 --self-contained true /p:PublishSingleFile=true

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          $publishDir = (Resolve-Path "bin\Release\net8.0-windows\win-x64\publish").Path
          & $iscc "/DPublishDir=$publishDir" "installer\TweaksAndRegistry.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Tweaks-and-Registry-portable-win-x64
          path: bin/Release/net8.0-windows/win-x64/publish/TweaksAndRegistry.exe
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Tweaks-and-Registry-installer-win-x64
          path: installer/Output/TweaksAndRegistry-Setup-x64.exe
          if-no-files-found: error
